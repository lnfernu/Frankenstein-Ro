name: Bug Report
description: Report a bug, unexpected behavior or compatibility issue in Frankenstein RO.
title: "[Bug]: "
labels: ["bug"]

body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve Frankenstein RO.

        Before submitting a report, please make sure the issue has not already been reported.

        The more information you provide, the easier it will be to reproduce and investigate the problem.

  - type: input
    id: version
    attributes:
      label: Project Version
      description: Specify the Frankenstein RO version, release or Git commit you are using.
      placeholder: Example: v0.8.0 or commit abc1234
    validations:
      required: true

  - type: input
    id: client
    attributes:
      label: Ragnarok Client Version
      description: Client executable version or client date.
      placeholder: Example: 2026-01-07 Ragexe
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Clearly describe the problem.
      placeholder: Explain what happened.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: Describe exactly how the issue can be reproduced.
      placeholder: |
        1.
        2.
        3.
        4.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: Describe what should have happened.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: Describe what actually happened.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / Console Output
      description: Paste any relevant server logs, crash logs or console output.
      render: shell
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or Videos
      description: If applicable, attach screenshots or videos demonstrating the issue.
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        Please describe your environment.

        - Operating System
        - Compiler (if applicable)
        - Database
        - Client Version
        - Custom modifications
        - Relevant configuration changes
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Information
      description: Include anything else that may help identify the problem.
    validations:
      required: false

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I searched existing Issues before creating this report.
          required: true
        - label: I have provided enough information for the issue to be reproduced.
          required: true
        - label: The information provided in this report is accurate to the best of my knowledge.
          required: true